spring:
  config:
    activate:
      on-profile: dev

  jpa:
    show-sql: true
    properties:
      hibernate:
        format_sql: true
    hibernate:
      ddl-auto: create
    defer-datasource-initialization: true
    database-platform: org.hibernate.dialect.PostgreSQLDialect

  sql:
    init:
      mode: always
      platform: postgresql
      data-locations: classpath:data.sql

#  datasource:
#    url: jdbc:postgresql://localhost:5432/franchise
#    username: postgres
#    password: qwer
#    driver-class-name: org.postgresql.Driver

  redis:
    host: localhost
    port: 6379

server:
  port: 8080

my:
  nickname: 8080server
