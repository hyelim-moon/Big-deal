spring:
  config:
    activate:
      on-profile: dev

  jpa:
    show-sql: true
    properties:
      hibernate:
        format_sql: true
    hibernate:
      ddl-auto: update  # 또는 'none'으로 설정
    defer-datasource-initialization: true
    database-platform: org.hibernate.dialect.PostgreSQLDialect

  sql:
    init:
      mode: never  # 초기화 스크립트를 사용하지 않도록 설정

  datasource:
    url: jdbc:postgresql://localhost:5432/franchise
    username: postgres
    password: qwer
    driver-class-name: org.postgresql.Driver

  redis:
    host: localhost
    port: 6379

server:
  port: 8080

my:
  nickname: 8080server
