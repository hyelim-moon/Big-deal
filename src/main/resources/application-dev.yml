spring:
  config:
    activate:
      on-profile: dev

  jpa:
    show-sql: true
    properties:
      hibernate:
        format_sql: true
    hibernate:
      ddl-auto: update  # 'update'로 두는 것이 일반적
    defer-datasource-initialization: true
    database-platform: org.hibernate.dialect.H2Dialect  # H2에 맞게 변경

  datasource:
    url: jdbc:h2:mem:testdb;DB_CLOSE_DELAY=-1;MODE=PostgreSQL  # H2 인메모리 데이터베이스 URL
    username: sa  # H2 기본 사용자명
    password: password  # 기본 비밀번호
    driver-class-name: org.h2.Driver

  redis:
    host: localhost
    port: 6379
