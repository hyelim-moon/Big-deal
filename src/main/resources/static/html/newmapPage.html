<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <title>가맹점 찾기</title>
    <link rel="stylesheet" href="../css/mapPage.css">
    <link rel="stylesheet" href="../css/newmapPage.css">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>
<header>
    <!--상단 로고 및 메뉴 버튼-->
    <nav class="navbar navbar-light bg-white fixed-top">
        <div class="container-fluid">
            <button class="navbar-toggler" type="button" data-bs-toggle="offcanvas" data-bs-target="#offcanvasNavbar" aria-controls="offcanvasNavbar">
                <span class="navbar-toggler-icon"></span>
            </button>
            <a class="navbar-brand" href="#">
                <img src="../img/Logo.png" alt="지역화폐 서비스 로고" style="height: 40px;"/>
            </a>
            <div class="offcanvas offcanvas-start" tabindex="-1" id="offcanvasNavbar" aria-labelledby="offcanvasNavbarLabel">
                <div class="offcanvas-header">
                    <h5 class="offcanvas-title" id="offcanvasNavbarLabel">지역화폐 활성화 서비스</h5>
                    <button type="button" class="btn-close text-reset" data-bs-dismiss="offcanvas" aria-label="Close"></button>
                </div>
                <div class="offcanvas-body">
                    <ul class="navbar-nav justify-content-end flex-grow-1 pe-3">
                        <li class="nav-item"><a class="nav-link active" href="#">Home</a></li>
                        <li class="nav-item"><a class="nav-link" href="#">Link</a></li>
                    </ul>
                </div>
            </div>
        </div>
    </nav>
</header>

<!-- 지도 검색 레이어 -->
<div id="innerSearchLayer">
    <form id="insideTotalSearchForm" class="inside_sch" role="search">
        <fieldset>
            <div class="box_search default_search">
                <input type="search" id="innerQuery" class="tf_keyword" placeholder="장소, 주소 검색">
            </div>
        </fieldset>
    </form>
</div>

<!-- 지도 컨테이너 -->
<div class="map-container">
    <div class="map_wrap">
        <!-- 지도를 이곳에 넣음 -->
        <div id="map"></div>
        <!-- 카테고리 리스트 -->
        <ul id="category">
            <li id="BK9" data-order="0">
                <span class="category_bg bank"></span>
                모바일형(QR코드)
            </li>
            <li id="MT1" data-order="1">
                <span class="category_bg mart"></span>
                선불카드형
            </li>
            <li id="PM9" data-order="2">
                <span class="category_bg pharmacy"></span>
                체크카드형
            </li>
            <li id="OL7" data-order="3">
                <span class="category_bg oil"></span>
                지류형(종이 화폐)
            </li>
        </ul>
    </div>
</div>



    <!-- 로그인, 회원가입 버튼
    <div class="btn-container">
        <div class="button">
            <p class="btnText">Login</p>
            <div class="btnTwo">
                <p class="btnText2">Go!</p>
            </div>
        </div>
        <div class="button">
            <p class="btnText">Sign-up</p>
            <div class="btnTwo">
                <p class="btnText2">Go!</p>
            </div>
        </div>
    </div>
    -->


<!-- 평점 입력을 위한 모달 -->
<div class="modal fade" id="reviewModal" tabindex="-1" aria-labelledby="reviewModalLabel" aria-hidden="true">
    <div class="modal-dialog modal-dialog-centered modal-dialog-scrollable">
        <div class="modal-content">
            <div class="modal-header">
                <h5 class="modal-title" id="reviewModalLabel">평점 등록</h5>
                <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
            </div>
            <div class="modal-body">
                <div class="mb-3">
                    <label>평점</label>
                    <div class="rating_box">
                        <div class="rating">
                            ★★★★★
                            <span class="rating_star">★★★★★</span>
                            <input type="range" value="1" step="1" min="0" max="10">
                        </div>
                    </div>
                </div>
                <div class="mb-3">
                    <label for="reviewText" class="form-label">리뷰 내용</label>
                    <textarea class="form-control" id="reviewText" rows="3" placeholder="리뷰를 입력해주세요..."></textarea>
                </div>
                <div class="mb-3">
                    <label for="imageUpload" class="form-label">사진 업로드</label>
                    <input class="form-control" type="file" id="imageUpload">
                </div>
            </div>
            <div class="modal-footer justify-content-center">
                <button type="button" class="btn btn-primary" id="submitReviewButton">등록</button>
                <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">취소</button>
            </div>
        </div>
    </div>
</div>

<!-- Scripts -->
<script src="https://ajax.googleapis.com/ajax/libs/jquery/3.5.1/jquery.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script src="https://dapi.kakao.com/v2/maps/sdk.js?appkey=b43e302547d37e9c52e6fc0644fae888&libraries=services,clusterer"></script>
<script src="../js/newmapPage.js"></script>
</body>
</html>
