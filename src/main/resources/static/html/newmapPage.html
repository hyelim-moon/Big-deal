<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <title>가맹점 찾기</title>
    <link rel="stylesheet" href="../css/mapPage.css">
    <link rel="stylesheet" href="../css/newmapPage.css">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>
<header>
    <!--상단 로고 및 메뉴 버튼-->
    <nav class="navbar navbar-light bg-white fixed-top">
        <div class="container-fluid">
            <button class="navbar-toggler" type="button" data-bs-toggle="offcanvas" data-bs-target="#offcanvasNavbar" aria-controls="offcanvasNavbar">
                <span class="navbar-toggler-icon"></span>
            </button>
            <a class="navbar-brand" href="#">
                <img src="../img/Logo.png" alt="지역화폐 서비스 로고" style="height: 40px;"/>
            </a>


                <!-- 로그인, 회원가입 버튼 -->
                <div id="loginButton" class="d-none">
                    <div class="button">
                        <p class="btnText">로그인</p>
                        <div class="btnTwo">
                            <p class="btnText2">Go!</p>
                        </div>
                    </div>
                </div>

            <!-- 프로필 버튼 -->
            <h2 class="tit_profile PROFILE-IMG profile-button" id="btnProfile" class="d-none">
                <a href="#">
                    <img src="../img/btn_pro.png" width="36" height="36" class="img_profile HIDDEN" alt="프로필" id="profileImg">
                </a>
            </h2>


            <!--프로필 내용-->
            <div class="LayerProfile" id="profileLayer" style="display: none;">
                <div class="info_profile">
                    <div class="thumb_profile">
                        <img src="../img/btn_pro.png" width="44" height="44" class="img_profile" alt="" data-id="profileImg">
                    </div>
                    <div class="wrap_user">
                        <strong class="tit_name" data-id="nickName">영수</strong>
                        <a href="/html/myPage.html" class="link_profile edit" data-id="edit">프로필 수정</a>
                    </div>
                    <a href="#" class="btn_logout" data-id="logout" id="logout-button">로그아웃</a>
                </div>
                <div class="my_page">
                    <a href="#none" target="_top" data-id="fav">내 정보</a>
                    <a href="#none" target="_top" data-id="homeCompany">내 리뷰</a>
                    <a href="#none" target="_top" data-id="review">후기 <em class="num" data-id="reviewCount"></em></a>
                </div>
            </div>


            <!--왼쪽 상단 메뉴바-->
            <div class="offcanvas offcanvas-start" tabindex="-1" id="offcanvasNavbar" aria-labelledby="offcanvasNavbarLabel">
                <div class="offcanvas-header">
                    <h5 class="offcanvas-title" id="offcanvasNavbarLabel">지역화폐 활성화 서비스</h5>
                    <button type="button" class="btn-close text-reset" data-bs-dismiss="offcanvas" aria-label="Close"></button>
                </div>
                <div class="offcanvas-body">
                    <ul class="navbar-nav justify-content-end flex-grow-1 pe-3">
                        <li class="nav-item"><a class="nav-link active" href="#">Home</a></li>
                        <li class="nav-item"><a class="nav-link" href="#">내정보</a></li>
                        <li class="nav-item"><a class="nav-link" href="#">평점</a></li>
                    </ul>
                </div>
            </div>
        </div>
    </nav>
</header>

<!-- 지도 검색 레이어 -->
<div id="innerSearchLayer">
    <form id="insideTotalSearchForm" class="inside_sch" role="search" onsubmit="searchPlace(); return false">
        <fieldset>
            <div class="box_search default_search">
                <input type="search" id="innerQuery" class="tf_keyword" placeholder="장소, 주소 검색">
            </div>
        </fieldset>
    </form>
</div>

<!-- 지도 컨테이너 -->
<div class="map-container">
    <div class="map_wrap">
        <!-- 지도를 이곳에 넣음 -->
        <div id="menu_wrap" class="bg_white">
<!--            <div class="option">-->
<!--                <div>-->
<!--                    <form onsubmit="searchPlace(); return false">-->
<!--                        장소 검색 :-->
<!--                        <input type="text" value="" id="keyword" size="15">-->
<!--                        <button id="searchButton" type="submit" class="btn btn-primary">검색</button>-->
<!--                    </form>-->
<!--                </div>-->
<!--            </div>-->
            <hr>
            <ul id="placesList"></ul>
           <div id="pagination"></div>
        </div>
    </div>


    <div id="map"></div>
        <!-- 카테고리 리스트 -->
        <ul id="category">
            <li id="BK9" data-order="0">
                <span class="category_bg bank"></span>
                지역화폐
            </li>
            <li id="create_marker" class="drawing-btn" data-type="MARKER">
                <span class="new_marker"></span> <!-- 새로운 클래스 new_marker 사용 -->
                가맹점 등록
            </li>
         </ul>
</div>


<!-- 평점 입력을 위한 모달 -->
<div class="modal fade" id="reviewModal" tabindex="-1" aria-labelledby="reviewModalLabel" aria-hidden="true">
    <div class="modal-dialog modal-dialog-centered modal-dialog-scrollable">
        <div class="modal-content">
            <div class="modal-header">
                <h5 class="modal-title" id="reviewModalLabel">평점 등록</h5>
                <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
            </div>
            <div class="modal-body">
                <div class="mb-3">
                    <label>평점</label>
                    <div class="rating_box">
                        <div class="rating">
                            ★★★★★
                            <span class="rating_star">★★★★★</span>
                            <input type="range" value="1" step="1" min="0" max="10">
                        </div>
                    </div>
                </div>
                <div class="mb-3">
                    <label for="reviewText" class="form-label">리뷰 내용</label>
                    <textarea class="form-control" id="reviewText" rows="3" placeholder="리뷰를 입력해주세요..."></textarea>
                </div>
                <div class="mb-3">
                    <label for="imageUpload" class="form-label">사진 업로드</label>
                    <input class="form-control" type="file" id="imageUpload">
                </div>
            </div>
            <div class="modal-footer justify-content-center">
                <button type="button" class="btn btn-primary" id="submitReviewButton">등록</button>
                <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">취소</button>
            </div>
        </div>
    </div>
</div>

<!-- Scripts -->
<script src="https://ajax.googleapis.com/ajax/libs/jquery/3.5.1/jquery.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script src="https://dapi.kakao.com/v2/maps/sdk.js?appkey=b43e302547d37e9c52e6fc0644fae888&libraries=services,clusterer,drawing"></script>
<script src="../js/newmapPage.js"></script>
<script src="../js/logoutPage.js"></script>
</body>
</html>
