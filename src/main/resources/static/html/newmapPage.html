<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <title>가맹점 찾기</title>
    <link rel="stylesheet" href="../css/mapPage.css">
    <link rel="stylesheet" href="../css/newmapPage.css">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>
<header>
    <div class="map_wrap">
        <div id="mapcategory" style="width:100%;height:100%;position:relative;overflow:hidden;"></div>
        <ul id="category">
            <li id="BK9" data-order="0">
                <span class="category_bg bank"></span>
                은행
            </li>
            <li id="MT1" data-order="1">
                <span class="category_bg mart"></span>
                마트
            </li>
            <li id="PM9" data-order="2">
                <span class="category_bg pharmacy"></span>
                약국
            </li>
            <li id="OL7" data-order="3">
                <span class="category_bg oil"></span>
                주유소
            </li>
            <li id="CE7" data-order="4">
                <span class="category_bg cafe"></span>
                카페
            </li>
            <li id="CS2" data-order="5">
                <span class="category_bg store"></span>
                편의점
            </li>
        </ul>
    </div>

    <!-- 로그인, 회원가입 버튼 -->
    <div class="btn-container">
        <div class="button">
            <p class="btnText">Login</p>
            <div class="btnTwo">
                <p class="btnText2">Go!</p>
            </div>
        </div>
        <div class="button">
            <p class="btnText">Sign-up</p>
            <div class="btnTwo">
                <p class="btnText2">Go!</p>
            </div>
        </div>
    </div>
</header>

<div class="map-container">
    <div id="map"></div>
</div>

<!-- 평점 입력을 위한 모달 -->
<div class="modal fade" id="reviewModal" tabindex="-1" aria-labelledby="reviewModalLabel" aria-hidden="true">
    <div class="modal-dialog modal-dialog-centered modal-dialog-scrollable">
        <div class="modal-content">
            <div class="modal-header">
                <h5 class="modal-title" id="reviewModalLabel">평점 등록</h5>
                <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
            </div>
            <div class="modal-body">
                <div class="mb-3">
                    <label>평점</label>
                    <div class="rating_box">
                        <div class="rating">
                            ★★★★★
                            <span class="rating_star">★★★★★</span>
                            <input type="range" value="1" step="1" min="0" max="10">
                        </div>
                    </div>
                </div>
                <div class="mb-3">
                    <label for="reviewText" class="form-label">리뷰 내용</label>
                    <textarea class="form-control" id="reviewText" rows="3" placeholder="리뷰를 입력해주세요..."></textarea>
                </div>
                <div class="mb-3">
                    <label for="imageUpload" class="form-label">사진 업로드</label>
                    <input class="form-control" type="file" id="imageUpload">
                </div>
            </div>
            <div class="modal-footer justify-content-center">
                <button type="button" class="btn btn-primary" id="submitReviewButton">등록</button>
                <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">취소</button>
            </div>
        </div>
    </div>
</div>

<!-- Scripts -->
<script src="https://ajax.googleapis.com/ajax/libs/jquery/3.5.1/jquery.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script src="https://dapi.kakao.com/v2/maps/sdk.js?appkey=b43e302547d37e9c52e6fc0644fae888&libraries=services,clusterer"></script>
<script src="../js/newmapPage.js"></script>
</body>
</html>
