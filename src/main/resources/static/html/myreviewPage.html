<!doctype html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta http-equiv="X-UA-Compatible" content="ie=edge">
    <title>나의 리뷰</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="../css/myreviewPage.css" rel="stylesheet">
</head>
<body>
<div class="sidebar">
    <a href="myPage.html">내정보</a>
    <a href="myreviewPage.html">나의 리뷰</a>
    <a href="workPlace.html">나의 사업장</a>
</div>
<div class="content">
    <div class="container mt-5">
        <div class="card">
            <div class="card-body">
                <h2 class="card-title text-center mb-4">나의 리뷰</h2>
                <div class="table-responsive">
                    <table class="table table-striped table-hover">
                        <thead>
                        <tr>
                            <th scope="col">상호명</th>
                            <th scope="col">별점</th>
                            <th scope="col">작성날짜</th>
                            <th scope="col">액션</th>
                        </tr>
                        </thead>
                        <tbody id="reviewList">
                        <!-- 리뷰 목록이 여기에 동적으로 추가됩니다. -->
                        </tbody>
                    </table>
                </div>
            </div>
        </div>
    </div>

    <!-- 평점 입력 및 수정을 위한 모달 -->
    <div class="modal fade" id="reviewModal" tabindex="-1" aria-labelledby="reviewModalLabel" aria-hidden="true">
        <div class="modal-dialog modal-dialog-centered modal-dialog-scrollable">
            <div class="modal-content">
                <div class="modal-header">
                    <h5 class="modal-title" id="reviewModalLabel">평점 등록</h5>
                    <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
                </div>
                <div class="modal-body">
                    <div class="mb-3">
                        <label>평점</label>
                        <div class="rating_box">
                            <div class="rating">
                                ★★★★★
                                <span class="rating_star">★★★★★</span>
                                <input type="range" value="1" step="1" min="0" max="10" id="reviewRating">
                            </div>
                        </div>
                    </div>
                    <div class="mb-3">
                        <label for="reviewText" class="form-label">리뷰 내용</label>
                        <textarea class="form-control" id="reviewText" rows="3" placeholder="리뷰를 입력해주세요..."></textarea>
                    </div>
                    <div class="mb-3">
                        <label for="imageUpload" class="form-label">사진 업로드</label>
                        <input class="form-control" type="file" id="imageUpload">
                    </div>
                </div>
                <div class="modal-footer justify-content-center">
                    <button type="button" class="btn btn-primary" id="submitReviewButton">등록</button>
                    <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">취소</button>
                </div>
            </div>
        </div>
    </div>
</div>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script src="../js/myreviewPage.js"></script>
</body>
</html>
