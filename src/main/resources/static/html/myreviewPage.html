<!doctype html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, minimum-scale=1.0">
    <meta http-equiv="X-UA-Compatible" content="ie=edge">
    <title>나의 리뷰 페이지</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="../css/myReviewPage.css" rel="stylesheet">
</head>
<body>
<div class="sidebar">
    <a href="myPage.html">내정보</a>
    <a href="myreviewPage.html">나의 리뷰</a>
</div>
<div class="content">
    <div class="container">
        <div class="row justify-content-center">
            <div class="col-auto">
                <a href="successPage.html">
                    <img src="../img/MainLogo.png" alt="지역화폐 로고" width="150" height="150">
                </a>
            </div>
        </div>
        <h4 class="text-center mb-5">나의 리뷰</h4>
        <div class="list-group" id="reviewList">
            <!-- 리뷰 항목이 여기에 동적으로 추가됩니다. -->
            <div class="list-group-item text-center" id="noReviewsMessage">리뷰가 없습니다.</div>
        </div>
    </div>

    <!-- 상세보기 모달 -->
    <div class="modal fade" id="reviewDetailModal" tabindex="-1" aria-labelledby="reviewDetailModalLabel" aria-hidden="true">
        <div class="modal-dialog">
            <div class="modal-content">
                <div class="modal-header">
                    <h5 class="modal-title" id="reviewDetailModalLabel">리뷰 상세 보기</h5>
                    <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
                </div>
                <div class="modal-body" id="reviewDetailContent">
                    <!-- 리뷰 상세 내용이 여기에 표시됩니다. -->
                </div>
                <div class="modal-footer">
                    <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">닫기</button>
                </div>
            </div>
        </div>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script src="../js/myReviewPage.js"></script>
</body>
</html>
