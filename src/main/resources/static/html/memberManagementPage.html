<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta http-equiv="X-UA-Compatible" content="ie=edge">
    <title>회원 관리 페이지</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="../css/memberManagementPage.css" rel="stylesheet">
</head>
<body>
<header class="container-fluid p-4">
    <div class="d-flex justify-content-between align-items-center">
        <img src="../img/MainLogo.png" alt="지역화폐 로고" class="logo">
        <button onclick="navigateToMainPage()" class="btn btn-outline-secondary rounded-pill">메인으로 돌아가기</button>
    </div>
</header>

<div class="container mt-5">
    <div class="card shadow-sm">
        <div class="card-body">
            <h2 class="card-title text-center mb-4">회원 관리</h2>
            <!-- 검색 필드 -->
            <div class="row mb-3">
                <div class="col-md-4">
                    <input type="text" class="form-control" id="searchID" placeholder="ID 검색" onkeyup="filterMembers()">
                </div>
                <div class="col-md-4">
                    <input type="text" class="form-control" id="searchType" placeholder="회원타입 검색" onkeyup="filterMembers()">
                </div>
            </div>
            <div class="table-responsive">
                <table class="table table-striped table-hover">
                    <thead>
                    <tr>
                        <th scope="col">#</th>
                        <th scope="col">ID</th>
                        <th scope="col">회원타입</th>
                        <th scope="col">작업</th>
                    </tr>
                    </thead>
                    <tbody id="memberList">
                    <!-- 회원 목록이 여기에 동적으로 추가됩니다. -->
                    </tbody>
                </table>
            </div>
        </div>
    </div>
</div>

<!-- 회원 상세보기 및 수정 모달 -->
<div class="modal fade" id="memberDetailModal" tabindex="-1" aria-labelledby="memberDetailModalLabel" aria-hidden="true">
    <div class="modal-dialog modal-dialog-centered modal-lg">
        <div class="modal-content">
            <div class="modal-header">
                <h5 class="modal-title" id="memberDetailModalLabel">회원 상세 정보</h5>
                <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
            </div>
            <div class="modal-body">
                <form id="memberDetailForm">
                    <div class="mb-3">
                        <label for="detailMemberID" class="form-label">ID</label>
                        <input type="text" class="form-control" id="detailMemberID" readonly>
                    </div>
                    <div class="mb-3">
                        <label for="detailMemberType" class="form-label">회원타입</label>
                        <select class="form-select" id="detailMemberType" aria-label="Default select example">
                            <option value="일반 회원">일반 회원</option>
                            <option value="사업자">사업자</option>
                        </select>
                    </div>
                </form>
            </div>
            <div class="modal-footer justify-content-center">
                <button type="button" class="btn btn-primary" onclick="saveMemberDetails()">수정</button>
                <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">닫기</button>
            </div>
        </div>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script src="../js/memberManagementPage.js"></script>
</body>
</html>
