<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>회원 가입</title>
    <link href="https://stackpath.bootstrapcdn.com/bootstrap/5.0.0-alpha2/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="../css/joinPage.css">
</head>
<body>
<header>
    <div class="container">
        <!-- 로고 클릭 시 mappage로 이동 -->
        <a href="mapPage.html">
            <img src="../img/MainLogo.png" alt="지역화폐 로고" width="150" height="150">
        </a>
    </div>
</header>

<section class="join-section">
    <div class="container">
        <!-- 버튼으로 사업자 및 일반 회원 선택 -->
        <div class="mb-3 text-center">
            <button type="button" class="btn btn-primary me-3" id="business-btn">사업자</button>
            <button type="button" class="btn btn-primary" id="user-btn">일반 회원</button>
        </div>

        <!-- 회원 가입 폼 -->
        <form id="user-form">
            <div class="mb-3 d-flex align-items-center">
                <input type="text" class="form-control" id="username" name="username" placeholder="아이디" required>
                <!-- 일반 회원 아이디 중복 확인 버튼 -->
                <button type="button" class="btn btn-primary ms-2" id="check-username" data-username-input-id="username">중복확인</button>
            </div>
            <div class="mb-3">
                <input type="password" class="form-control" id="password" name="password" placeholder="비밀번호" required>
            </div>
            <div class="mb-3 d-flex align-items-center">
                <input type="email" class="form-control" id="email" name="email" placeholder="이메일 인증" required>
                <!-- 이메일 인증 버튼에 이벤트 추가 -->
                <button type="button" class="btn btn-primary ms-2" id="send-email">메일발송</button>
            </div>
            <div class="mb-3 d-flex align-items-center">
                <input type="text" class="form-control" id="authCode" name="authCode" placeholder="인증번호">
                <!-- 인증번호 확인 버튼에 이벤트 추가 -->
                <button type="button" class="btn btn-primary ms-2" id="verify-authCode">인증번호확인</button>
            </div>
            <button type="submit" class="btn btn-primary btn-block">가입하기</button>
        </form>

        <!-- 사업자 가입 폼 -->
        <form id="business-form" style="display: none;">
            <div class="mb-3 d-flex align-items-center">
                <input type="text" class="form-control" id="business-id" name="business-id" placeholder="사업자 번호" required>
                <button type="button" class="btn btn-primary ms-2">인증하기</button>
            </div>
            <div class="mb-3 d-flex align-items-center">
                <input type="text" class="form-control" id="business-username" name="business-username" placeholder="아이디" required>
                <!-- 사업자 아이디 중복 확인 버튼 -->
                <button type="button" class="btn btn-primary ms-2" id="check-business-username" data-username-input-id="business-username">중복확인</button>
            </div>
            <div class="mb-3">
                <input type="password" class="form-control" id="business-password" name="business-password" placeholder="비밀번호" required>
            </div>
            <div class="mb-3 d-flex align-items-center">
                <input type="email" class="form-control" id="business-email" name="business-email" placeholder="이메일 인증" required>
                <button type="button" class="btn btn-primary ms-2">메일발송</button>
            </div>
            <div class="mb-3 d-flex align-items-center">
                <input type="text" class="form-control" id="business-authCode" name="business-authCode" placeholder="인증번호">
                <button type="button" class="btn btn-primary ms-2">인증번호확인</button>
            </div>
            <button type="submit" class="btn btn-primary btn-block">가입하기</button>
        </form>
    </div>
</section>

<script src="https://code.jquery.com/jquery-3.5.1.slim.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@popperjs/core@2.5.4/dist/umd/popper.min.js"></script>
<script src="https://stackpath.bootstrapcdn.com/bootstrap/5.0.0-alpha2/js/bootstrap.min.js"></script>
<script src="../js/joinPage.js"></script>
</body>
</html>
