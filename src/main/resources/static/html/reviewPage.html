<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Review Page</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- Font Awesome CDN 추가 -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/5.9.0/css/all.min.css" integrity="sha512-q3eWabyZPc1XTCmF+8/LuE1ozpg5xxn7iO89yfSOd5/oKvyqLngoNGsx8jq92Y8eXJ/IRxQbEC+FGSYxtk2oiw==" crossorigin="anonymous" referrerpolicy="no-referrer" />
    <link rel="stylesheet" href="../css/reviewPage.css">
</head>
<body>
<header>
</header>

<div class="container mt-5">
    <div class="text-center">
        <button type="button" class="btn btn-outline-primary btn-lg" data-bs-toggle="modal" data-bs-target="#reviewModal">평점 등록</button>
    </div>
</div>

<!-- 평점 입력을 위한 모달 -->
<div class="modal fade" id="reviewModal" tabindex="-1" aria-labelledby="reviewModalLabel" aria-hidden="true">
    <div class="modal-dialog modal-dialog-centered modal-dialog-scrollable">
        <div class="modal-content">
            <div class="modal-header">
                <h5 class="modal-title" id="reviewModalLabel">평점 등록</h5>
                <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
            </div>
            <div class="modal-body">
                <div class="mb-3">
                    <label class="form-label">별점</label>
                    <div class="star-rating">
                        <input type="radio" id="star1" name="rating" value="1" onclick="selectRating(1)"><label for="star1"><i class="fas fa-star"></i></label>
                        <input type="radio" id="star2" name="rating" value="2" onclick="selectRating(2)"><label for="star2"><i class="fas fa-star"></i></label>
                        <input type="radio" id="star3" name="rating" value="3" onclick="selectRating(3)"><label for="star3"><i class="fas fa-star"></i></label>
                        <input type="radio" id="star4" name="rating" value="4" onclick="selectRating(4)"><label for="star4"><i class="fas fa-star"></i></label>
                        <input type="radio" id="star5" name="rating" value="5" onclick="selectRating(5)"><label for="star5"><i class="fas fa-star"></i></label>
                    </div>
                </div>
                <div class="mb-3">
                    <label for="reviewText" class="form-label">리뷰 내용</label>
                    <textarea class="form-control" id="reviewText" rows="3" placeholder="리뷰를 입력해주세요..."></textarea>
                </div>
                <div class="mb-3">
                    <label for="imageUpload" class="form-label">사진 업로드</label>
                    <input class="form-control" type="file" id="imageUpload">
                </div>
            </div>
            <div class="modal-footer justify-content-center">
                <button type="button" class="btn btn-primary" onclick="submitReview()">등록</button>
                <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">취소</button>
            </div>
        </div>
    </div>
</div>

<script src="https://ajax.googleapis.com/ajax/libs/jquery/3.5.1/jquery.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js" ></script>
<script src="../js/reviewPage.js"></script>
</body>
</html>
