<!doctype html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, minimum-scale=1.0">
    <meta http-equiv="X-UA-Compatible" content="ie=edge">
    <title>내 정보 페이지</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css" rel="stylesheet">
    <link href="../css/test.css" rel="stylesheet">
</head>
<body>
<header>
    <div class="container-fluid p-4">
        <div class="d-flex justify-content-between align-items-center w-100">
            <img src="../img/MainLogo.png" alt="지역화폐 로고" class="logo">
            <div class="ms-auto">
                <a href="loginPage.html" class="btn btn-outline-secondary rounded-pill">로그아웃</a>
            </div>
        </div>
    </div>
</header>


<div class="container mt-5">
    <div class="row justify-content-center">
        <div class="col-md-4 col-sm-6 mb-3">
            <div class="card-container shadow-sm">
                <div class="icon-container mb-3">
                    <i class="fas fa-user-edit fa-3x text-primary"></i>
                </div>
                <h5>회원정보 수정</h5>
                <p>본인정보, 비밀번호, 이메일 등을 수정하세요.</p>
                <button onclick="navigateTo('updateInfoPage.html')" class="btn btn-primary rounded-pill">수정하기</button>
            </div>
        </div>
        <div class="col-md-4 col-sm-6 mb-3">
            <div class="card-container shadow-sm">
                <div class="icon-container mb-3">
                    <i class="fas fa-comments fa-3x text-info"></i>
                </div>
                <h5>내 리뷰 관리</h5>
                <p>내 리뷰를 관리하세요.</p>
                <button onclick="navigateTo('myReviewPage.html')" class="btn btn-info rounded-pill">관리하기</button>
            </div>
        </div>
        <div class="col-md-4 col-sm-6 mb-3">
            <div class="card-container shadow-sm">
                <div class="icon-container mb-3">
                    <i class="fas fa-user-times fa-3x text-danger"></i>
                </div>
                <h5>회원탈퇴</h5>
                <p>서비스 이용을 중단하시겠습니까?</p>
                <button type="button" class="btn btn-danger rounded-pill" data-bs-toggle="modal" data-bs-target="#surveyModal">탈퇴하기</button>
            </div>
        </div>
    </div>
</div>

<!-- Modal -->
<div class="modal fade" id="surveyModal" tabindex="-1" aria-labelledby="surveyModalLabel" aria-hidden="true">
    <div class="modal-dialog modal-dialog-centered modal-dialog-scrollable">
        <div class="modal-content">
            <div class="modal-header">
                <h5 class="modal-title" id="surveyModalLabel">회원 탈퇴</h5>
                <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
            </div>
            <div class="modal-body">
                <div class="form-text" style="color: black; font-size: 15px; margin-bottom: 20px;">
                    <label class="form-text-label">회원 탈퇴 사유</label>
                </div>
                <div class="form-check" style="margin-bottom: 20px;">
                    <input class="form-check-input" type="checkbox" name="surveyOption" id="option1">
                    <label class="form-check-label" for="option1">잘 놀다 갑니다</label>
                </div>
                <div class="form-check" style="margin-bottom: 20px;">
                    <input class="form-check-input" type="checkbox" name="surveyOption" id="option2">
                    <label class="form-check-label" for="option2">서비스 불만족</label>
                </div>
                <div class="form-check" style="margin-bottom: 20px;">
                    <input class="form-check-input" type="checkbox" name="surveyOption" id="option3">
                    <label class="form-check-label" for="option3">개인정보 노출 우려</label>
                </div>
                <div class="form-check" style="margin-bottom: 20px;">
                    <input class="form-check-input" type="checkbox" name="surveyOption" id="option4">
                    <label class="form-check-label" for="option4">기타 - 하단 25자 이내로 작성하세요.</label>
                </div>
                <textarea id="additionalComments" placeholder="내용을 입력해주세요." style="width: 100%;"></textarea>
            </div>
            <div class="modal-footer justify-content-center">
                <button type="button" class="btn btn-danger rounded-pill" onclick="withdraw()">탈퇴하기</button>
                <button type="button" class="btn btn-secondary rounded-pill" data-bs-dismiss="modal">취소</button>
            </div>
        </div>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/js/all.min.js"></script>
<script src="../js/test.js"></script>
</body>
</html>
