<!doctype html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, minimum-scale=1.0">
    <meta http-equiv="X-UA-Compatible" content="ie=edge">
    <title>내 정보 페이지</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="../css/myPage.css" rel="stylesheet">
    <style>
        .card .btn {
            margin-bottom: 0 !important; /* 버튼 아래의 마진 제거 */
        }
    </style>
</head>
<body>
<div class="sidebar">
    <a href="myPage.html">내정보</a>
    <a href="myreviewPage.html">나의 리뷰</a>
    <a href="workPlace.html">나의 사업장</a>
</div>
<div class="container">
    <a href="successPage.html">
        <div class="container">
            <div class="row justify-content-center">
                <div class="col-auto">
                    <img src="../img/MainLogo.png" alt="지역화폐 로고" width="150" height="150">
                </div>
            </div>
        </div>
    </a>
    <div class="container mt-5">
        <h4 class="text-center mb-5">내 정보 페이지</h4>
        <div class="card mx-auto border border-success" style="width: 25rem; height: 30rem; border-radius: 50px;">
            <div class="card-body mt-4">
                <div class="d-flex flex-column align-items-center text-center">
                    <div class="p-2 w-100">
                        <button class="btn btn-outline-success btn-lg">아이디</button>
                    </div>
                    <div class="p-2 w-100 mt-3">
                        <button class="btn btn-outline-success btn-lg">비밀번호</button>
                    </div>
                    <div class="p-2 w-100 mt-3">
                        <button class="btn btn-outline-success btn-lg" onclick="navigateToMyReviewPage()">나의 리뷰</button>
                    </div>
                    <div class="p-2 w-100 mt-3">
                        <button class="btn btn-outline-success btn-lg" onclick="navigateToMyWorkPage()">사업장</button>
                    </div>
                    <div class="p-2 w-100 mt-3">
                        <button type="button" class="btn btn-outline-success btn-lg" data-bs-toggle="modal" data-bs-target="#surveyModal">회원탈퇴</button>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <!-- Modal -->
    <div class="modal fade" id="surveyModal" tabindex="-1" aria-labelledby="surveyModalLabel" aria-hidden="true">
        <div class="modal-dialog modal-dialog-centered modal-dialog-scrollable">
            <div class="modal-content">
                <div class="modal-header">
                    <h5 class="modal-title" id="surveyModalLabel">회원 탈퇴</h5>
                    <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
                </div>
                <div class="modal-body">
                    <div class="form-text" style="color: black; font-size: 15px; margin-bottom: 20px;">
                        <label class="form-text-label">회원 탈퇴 사유</label>
                    </div>
                    <div class="form-check" style="margin-bottom: 20px;">
                        <input class="form-check-input" type="checkbox" name="surveyOption" id="option1">
                        <label class="form-check-label" for="option1">잘 놀다 갑니다</label>
                    </div>
                    <div class="form-check" style="margin-bottom: 20px;">
                        <input class="form-check-input" type="checkbox" name="surveyOption" id="option2">
                        <label class="form-check-label" for="option2">서비스 불만족</label>
                    </div>
                    <div class="form-check" style="margin-bottom: 20px;">
                        <input class="form-check-input" type="checkbox" name="surveyOption" id="option3">
                        <label class="form-check-label" for="option3">개인정보 노출 우려</label>
                    </div>
                    <div class="form-check" style="margin-bottom: 20px;">
                        <input class="form-check-input" type="checkbox" name="surveyOption" id="option4">
                        <label class="form-check-label" for="option4">기타 - 하단 25자 이내로 작성하세요.</label>
                    </div>
                    <textarea id="additionalComments" placeholder="내용을 입력해주세요." style="width: 100%;"></textarea>
                </div>
                <div class="modal-footer justify-content-center">
                    <button type="button" class="btn btn-danger" onclick="withdraw()">탈퇴하기</button>
                    <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">취소</button>
                </div>
            </div>
        </div>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script src="../js/myPage.js"></script>
<script>
    // "나의 리뷰" 버튼 클릭 시 myreviewPage.html로 이동
    function navigateToMyReviewPage() {
        window.location.href = 'myreviewPage.html';
    }

    // 회원 탈퇴 사유들을 경고창에 표시
    function showReasons() {
        let reasons = [];
        let checkboxes = document.querySelectorAll('input[name="surveyOption"]:checked');
        checkboxes.forEach((checkbox) => {
            let label = checkbox.nextElementSibling.textContent;
            if (checkbox.id === 'option4') {
                label += ': ' + document.getElementById('additionalComments').value;
            }
            reasons.push(label);
        });
        alert('탈퇴 사유: ' + reasons.join(', '));
    }

    // 회원 탈퇴
    function withdraw() {
        showReasons(); // 탈퇴 사유를 먼저 표시

        let reasons = [];
        let checkboxes = document.querySelectorAll('input[name="surveyOption"]:checked');
        checkboxes.forEach((checkbox) => {
            let label = checkbox.nextElementSibling.textContent;
            if (checkbox.id === 'option4') {
                label += ': ' + document.getElementById('additionalComments').value;
            }
            reasons.push(label);
        });

        // JWT 토큰 가져오기
        const token = localStorage.getItem('accessToken');

        if (!token) {
            alert('로그인 상태가 아닙니다.');
            return;
        }

        fetch('http://localhost:8080/api/v1/member', {
            method: 'DELETE',
            headers: {
                'Content-Type': 'application/json',
                'Authorization': `Bearer ${token}`
            }
        })
        .then(response => {
            if (response.ok) {
                alert('회원 탈퇴가 성공적으로 처리되었습니다.');
                localStorage.removeItem('username');
                localStorage.removeItem('accessToken');
                window.location.href = 'mapPage'; // 탈퇴 후 리디렉션
            } else {
                return response.json().then(errorData => {
                    throw new Error(errorData.message || '회원 탈퇴 중 오류가 발생했습니다.');
                });
            }
        })
        .catch(error => {
            console.error('회원 탈퇴 요청 중 오류 발생:', error);
            alert('회원 탈퇴 요청 중 오류가 발생했습니다.');
        });
    }
</script>
</body>
</html>
