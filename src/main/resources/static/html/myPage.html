<!doctype html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, minimum-scale=1.0">
    <meta http-equiv="X-UA-Compatible" content="ie=edge">
    <title>내 정보 페이지</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="../css/myPage.css" rel="stylesheet">
</head>
<body>
<div class="sidebar">
    <a href="userinfo.html">내정보</a>
    <a href="myreviews.html">나의 리뷰</a>
</div>
<div class="container">
    <a href="successPage.html">
        <div class="container">
            <div class="row justify-content-center">
                <div class="col-auto">
                    <img src="../img/MainLogo.png" alt="지역화폐 로고" width="150" height="150">
                </div>
            </div>
        </div>
    </a>
    <div class="container mt-5">
        <h4 class="text-center mb-5">내 정보 페이지</h4>
        <div class="card mx-auto border border-success " style="width: 25rem; height: 30rem; border-radius: 50px;">
            <div class="card-body mt-4">
                <div class="d-flex flex-column align-items-center text-center">
                    <div class="p-2 w-20">
                        <div class="card">
                            <button class="btn btn-outline-success btn-lg">이메일</button>
                        </div>
                    </div>
                    <div class="p-2 w-20">
                        <div class="card mt-3">
                            <button class="btn btn-outline-success btn-lg">아이디</button>
                        </div>
                    </div>
                    <div class="p-2 w-20">
                        <div class="card mt-3">
                            <button class="btn btn-outline-success btn-lg">비밀번호</button>
                        </div>
                    </div>
                    <div class="p-2 w-20">
                        <div class="card mt-3">
                            <button class="btn btn-outline-success btn-lg">사업장</button>
                        </div>
                    </div>
                    <div class="p-2 w-20 mt-3">
                        <div class="card">
                            <button type="button" class="btn btn-outline-success btn-lg" data-bs-toggle="modal" data-bs-target="#surveyModal">회원탈퇴</button>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <!-- Modal -->
    <div class="modal fade" id="surveyModal" tabindex="-1" aria-labelledby="surveyModalLabel" aria-hidden="true">
        <div class="modal-dialog modal-dialog-centered modal-dialog-scrollable">
            <div class="modal-content">
                <div class="modal-header">
                    <h5 class="modal-title" id="surveyModalLabel">회원 탈퇴</h5>
                    <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
                </div>
                <div class="modal-body">
                    <div class="form-text" style="color: black; font-size: 15px; margin-bottom: 20px;">
                        <label class="form-text-label">회원 탈퇴 사유</label>
                    </div>
                    <div class="form-check" style="margin-bottom: 20px;">
                        <input class="form-check-input" type="checkbox" name="surveyOption" id="option1">
                        <label class="form-check-label" for="option1">잘 놀다 갑니다</label>
                    </div>
                    <div class="form-check" style="margin-bottom: 20px;">
                        <input class="form-check-input" type="checkbox" name="surveyOption" id="option2">
                        <label class="form-check-label" for="option2">서비스 불만족</label>
                    </div>
                    <div class="form-check" style="margin-bottom: 20px;">
                        <input class="form-check-input" type="checkbox" name="surveyOption" id="option3">
                        <label class="form-check-label" for="option3">개인정보 노출 우려</label>
                    </div>
                    <div class="form-check" style="margin-bottom: 20px;">
                        <input class="form-check-input" type="checkbox" name="surveyOption" id="option4">
                        <label class="form-check-label" for="option4">기타 - 하단 25자 이내로 작성하세요.</label>
                    </div>
                    <textarea id="additionalComments" placeholder="내용을 입력해주세요." style="width: 100%;"></textarea>
                </div>
                <div class="modal-footer justify-content-center">
                    <button type="button" class="btn btn-danger" onclick="showReasons()">탈퇴하기</button>
                    <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">취소</button>
                </div>
            </div>
        </div>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script src="../js/myPage.js"></script>
</body>
</html>
