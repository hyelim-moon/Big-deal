<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <title>로그인 성공</title>
    <link rel="stylesheet" href="../css/successPage.css">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>
<header>
    <img src="../img/MainLogo.png" alt="지역화폐 로고" width="150" height="150">
    <nav>
        <ul class="user-action">
            <li><span id="user-id"></span></li>
            <li><a href="mapPage.html"><button>로그아웃</button></a></li>
            <a href="myPage.html">
                <li><button>마이페이지</button></li>
            </a>
        </ul>
    </nav>
</header>
<div class="search-section">
    <select name="region" id="region">
        <option value="region1">지역 선택</option>
        <option value="region2">수원시</option>
    </select>
    <select name="sectors" id="sectors">
        <option value="sectors1">업종 선택</option>
        <option value="sectors2">음식점</option>
    </select>
    <select name="moneytype" id="moneytype">
        <option value="moneytype1">지역화폐 종류</option>
        <option value="moneytype2">지류형</option>
    </select>
    <!-- 현재 위치 버튼 추가 -->
    <form onsubmit="searchPlaces(); return false;" class="search-form">
        <div class="input-group">
            <input type="text" id="keyword" name="search" placeholder="원하는 가맹점을 검색해보세요.">
            <button type="submit" class="search-btn">검색</button>
            <button type="button" id="current-location-button" class="location-btn">
                <img src="../img/myLocation.png" alt="Current Location" style="width: 50px;">
            </button>
        </div>
    </form>
</div>

<div class="map-container">
    <div id="map" style="width: 100%; height: 100%;"></div>
    <div id="menu_wrap">
        <ul id="placesList"></ul>
        <div id="pagination"></div>
    </div>
</div>

<!-- 평점 입력을 위한 모달 -->
<div class="modal fade" id="reviewModal" tabindex="-1" aria-labelledby="reviewModalLabel" aria-hidden="true">
    <div class="modal-dialog modal-dialog-centered modal-dialog-scrollable">
        <div class="modal-content">
            <div class="modal-header">
                <h5 class="modal-title" id="reviewModalLabel">평점 등록</h5>
                <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
            </div>
            <div class="modal-body">
                <div class="mb-3">
                    <label>평점</label>
                    <div class="rating_box">
                        <div class="rating">
                            ★★★★★
                            <span class="rating_star">★★★★★</span>
                            <input type="range" name="rating" value="1" step="1" min="0" max="10">
                        </div>
                    </div>
                </div>
                <div class="mb-3">
                    <label for="reviewText" class="form-label">리뷰 내용</label>
                    <textarea class="form-control" id="reviewText" rows="3" placeholder="리뷰를 입력해주세요..."></textarea>
                </div>
                <div class="mb-3">
                    <label for="imageUpload" class="form-label">사진 업로드</label>
                    <input class="form-control" type="file" id="imageUpload">
                </div>
            </div>
            <div class="modal-footer justify-content-center">
                <button type="button" class="btn btn-primary" id="submitReviewButton" onclick="submitReview()">등록</button>
                <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">취소</button>
            </div>
        </div>
    </div>
</div>

<script src="https://dapi.kakao.com/v2/maps/sdk.js?appkey=b43e302547d37e9c52e6fc0644fae888&libraries=services,clusterer"></script>
<script src="https://ajax.googleapis.com/ajax/libs/jquery/3.5.1/jquery.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js" ></script>
<script src="../js/mapPage.js"></script>
<script src="../js/successPage.js"></script>
</body>
</html>
