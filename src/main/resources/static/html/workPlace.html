<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="../css/workPlace.css" rel="stylesheet">
</head>
<body>
<div class="sidebar">
    <a href="myPage.html">내정보</a>
    <a href="myreviewPage.html">나의 리뷰</a>
    <a href="workPlace.html">나의 사업장</a>
</div>
<div class="container">
    <a href="mapPage.html">
        <div class="container">
            <div class="row justify-content-center">
                <div class="col-auto">
                    <img src="../img/MainLogo.png" alt="지역화폐 로고" width="150" height="150">
                </div>
            </div>
        </div>
    </a>
    <div class="container mt-5">
        <h4 class="text-center mb-5">내 사업장 페이지</h4>
        <div class="card mx-auto border border-success" style="width: 25rem; height: 30rem; border-radius: 50px;">
            <div class="card-body mt-4">
                <div class="d-flex flex-column align-items-center text-center">
                    <div class="p-2 w-20">
                        <div class="card mt-5">
                            <button type="button" class="btn btn-outline-success btn-lg" data-bs-toggle="modal" data-bs-target="#surveyModal">정보수정</button>
                        </div>
                    </div>
                    <div class="p-2 w-20">
                        <div class="card mt-5">
                            <button class="btn btn-outline-success btn-lg">평점보기</button>
                        </div>
                    </div>
                    <div class="p-2 w-20">
                        <div class="card mt-5">
                            <button class="btn btn-outline-success btn-lg">평점통계</button>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <div class="container mt-5">
        <!-- 가맹점 정보수정 모달 -->
        <div class="modal fade" id="surveyModal" tabindex="-1" aria-labelledby="surveyModalLabel" aria-hidden="true">
            <div class="modal-dialog modal-dialog-centered modal-dialog-scrollable modal-lg justify-content-center">
                <div class="modal-content">
                    <div class="modal-header">
                        <h5 class="modal-title" id="surveyModalLabel">가맹점 정보수정</h5>
                        <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
                    </div>
                    <div class="modal-body">
                        <!-- 사업장명 입력 및 수정 버튼 -->
                        <div class="input-group mb-3">
                            <span class="input-group-text">가맹점 이름</span>
                            <input type="text" class="form-control" id="businessName" placeholder="사업장명을 입력하세요" value="지역화폐가맹점" readonly>
                            <button type="button" class="btn btn-outline-success" onclick="openEditBusinessNameModal()">수정</button>
                        </div>

                        <!-- 위치 수정 -->
                        <div class="input-group mb-3">
                            <span class="input-group-text">위치</span>
                            <input type="text" class="form-control" id="locationName" placeholder="위치정보를 입력하세요." value="경민대학교 401호" readonly>
                            <button type="button" class="btn btn-outline-success" onclick="openEditLocationNameModal()">수정</button>
                        </div>

                        <!-- 파일 선택 -->
                        <div class="mb-3">
                            <input class="form-control" type="file" id="formFileMultiple" multiple>
                        </div>

                        <!-- 업종 선택 -->
                        <div class="mb-3">
                            <select class="form-select" id="businessCategory" aria-label="Default select example">
                                <option selected>업종 선택</option>
                                <option value="음식점">음식점</option>
                                <option value="술집">술집</option>
                                <option value="기타">기타</option>
                            </select>
                        </div>

                        <!-- 영업시간 수정 -->
                        <div class="input-group mb-3">
                            <span class="input-group-text">영업시간</span>
                            <input type="text" class="form-control" id="businessHours" placeholder="영업시간을 입력하세요." value="09:00 - 18:00" readonly>
                            <button type="button" class="btn btn-outline-success" onclick="openEditBusinessHoursModal()">수정</button>
                        </div>

                        <!-- 제공서비스 수정 -->
                        <div class="input-group mb-3">
                            <span class="input-group-text">제공 서비스</span>
                            <input type="text" class="form-control" id="servicesProvided" placeholder="제공 서비스를 입력하세요." value="Wi-Fi, 주차" readonly>
                            <button type="button" class="btn btn-outline-success" onclick="openEditServicesProvidedModal()">수정</button>
                        </div>

                        <!-- 기타 수정 -->
                        <div class="input-group mb-3">
                            <span class="input-group-text">기타</span>
                            <input type="text" class="form-control" id="additionalInfo" placeholder="기타 정보를 입력하세요." value="기타 정보" readonly>
                            <button type="button" class="btn btn-outline-success" onclick="openEditAdditionalInfoModal()">수정</button>
                        </div>
                    </div>
                    <div class="modal-footer justify-content-center">
                        <button type="button" class="btn btn-danger" onclick="saveAllChanges()">수정하기</button>
                        <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">취소</button>
                    </div>
                </div>
            </div>
        </div>

        <!-- 사업장명 수정 모달 -->
        <div class="modal fade" id="editBusinessNameModal" tabindex="-1" aria-labelledby="editBusinessNameModalLabel" aria-hidden="true">
            <div class="modal-dialog modal-dialog-centered modal-small">
                <div class="modal-content">
                    <div class="modal-header">
                        <h5 class="modal-title" id="editBusinessNameModalLabel">사업장명 수정</h5>
                        <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
                    </div>
                    <div class="modal-body">
                        <label for="newBusinessName" class="form-label">새 사업장명</label>
                        <input type="text" class="form-control" id="newBusinessName" placeholder="새 사업장명을 입력하세요">
                    </div>
                    <div class="modal-footer">
                        <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">취소</button>
                        <button type="button" class="btn btn-outline-success" onclick="saveBusinessName()">변경</button>
                    </div>
                </div>
            </div>
        </div>

        <!-- 위치정보 수정 모달 -->
        <div class="modal fade" id="editLocationNameModal" tabindex="-1" aria-labelledby="editLocationNameModalLabel" aria-hidden="true">
            <div class="modal-dialog modal-dialog-centered modal-small">
                <div class="modal-content">
                    <div class="modal-header">
                        <h5 class="modal-title" id="editLocationNameModalLabel">위치정보 수정</h5>
                        <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
                    </div>
                    <div class="modal-body">
                        <label for="newLocationName" class="form-label">새 위치정보</label>
                        <input type="text" class="form-control" id="newLocationName" placeholder="새 위치정보를 입력하세요">
                    </div>
                    <div class="modal-footer">
                        <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">취소</button>
                        <button type="button" class="btn btn-outline-success" onclick="saveLocationName()">변경</button>
                    </div>
                </div>
            </div>
        </div>

        <!-- 영업시간 수정 모달 -->
        <div class="modal fade" id="editBusinessHoursModal" tabindex="-1" aria-labelledby="editBusinessHoursModalLabel" aria-hidden="true">
            <div class="modal-dialog modal-dialog-centered modal-small">
                <div class="modal-content">
                    <div class="modal-header">
                        <h5 class="modal-title" id="editBusinessHoursModalLabel">영업시간 수정</h5>
                        <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
                    </div>
                    <div class="modal-body">
                        <label for="newBusinessHours" class="form-label">새 영업시간</label>
                        <input type="text" class="form-control" id="newBusinessHours" placeholder="새 영업시간을 입력하세요">
                    </div>
                    <div class="modal-footer">
                        <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">취소</button>
                        <button type="button" class="btn btn-outline-success" onclick="saveBusinessHours()">변경</button>
                    </div>
                </div>
            </div>
        </div>

        <!-- 제공서비스 수정 모달 -->
        <div class="modal fade" id="editServicesProvidedModal" tabindex="-1" aria-labelledby="editServicesProvidedModalLabel" aria-hidden="true">
            <div class="modal-dialog modal-dialog-centered modal-small">
                <div class="modal-content">
                    <div class="modal-header">
                        <h5 class="modal-title" id="editServicesProvidedModalLabel">제공 서비스 수정</h5>
                        <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
                    </div>
                    <div class="modal-body">
                        <label for="newServicesProvided" class="form-label">새 제공 서비스</label>
                        <input type="text" class="form-control" id="newServicesProvided" placeholder="새 제공 서비스를 입력하세요">
                    </div>
                    <div class="modal-footer">
                        <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">취소</button>
                        <button type="button" class="btn btn-outline-success" onclick="saveServicesProvided()">변경</button>
                    </div>
                </div>
            </div>
        </div>

        <!-- 기타 수정 모달 -->
        <div class="modal fade" id="editAdditionalInfoModal" tabindex="-1" aria-labelledby="editAdditionalInfoModalLabel" aria-hidden="true">
            <div class="modal-dialog modal-dialog-centered modal-small">
                <div class="modal-content">
                    <div class="modal-header">
                        <h5 class="modal-title" id="editAdditionalInfoModalLabel">기타 수정</h5>
                        <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
                    </div>
                    <div class="modal-body">
                        <label for="newAdditionalInfo" class="form-label">새 기타 정보</label>
                        <input type="text" class="form-control" id="newAdditionalInfo" placeholder="새 기타 정보를 입력하세요">
                    </div>
                    <div class="modal-footer">
                        <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">취소</button>
                        <button type="button" class="btn btn-outline-success" onclick="saveAdditionalInfo()">변경</button>
                    </div>
                </div>
            </div>
        </div>
    </div>
</div>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script src="../js/workPlace.js"></script>
</body>
</html>
