<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <title>사업장 관리</title>
    <link rel="stylesheet" href="/webjars/bootstrap/5.3.3/css/bootstrap.min.css">
    <link rel="stylesheet" href="../css/businessManagementPage.css">
</head>
<body>
<div class="sidebar">
    <a href="#home">홈</a>
    <a href="#businesses">사업장 관리</a>
    <a href="#members">회원 관리</a>
    <a href="#settings">설정</a>
</div>

<div class="content">
    <div class="container mt-5">
        <div class="card">
            <div class="card-body">
                <h2 class="card-title text-center mb-4">사업장 관리</h2>

                <!-- 검색 필드 추가 -->
                <div class="row mb-3">
                    <div class="col-md-4">
                        <input type="text" class="form-control" id="searchName" placeholder="사업장명 검색" onkeyup="filterBusinesses()">
                    </div>
                    <div class="col-md-4">
                        <input type="text" class="form-control" id="searchID" placeholder="ID 검색" onkeyup="filterBusinesses()">
                    </div>
                    <div class="col-md-4">
                        <input type="text" class="form-control" id="searchCategory" placeholder="업종 카테고리 검색" onkeyup="filterBusinesses()">
                    </div>
                </div>

                <div class="table-responsive">
                    <table class="table table-striped table-hover">
                        <thead>
                        <tr>
                            <th scope="col">#</th>
                            <th scope="col">사업장명</th>
                            <th scope="col">ID</th>
                            <th scope="col">업종</th>
                            <th scope="col">위치</th>
                            <th scope="col">작업</th>
                        </tr>
                        </thead>
                        <tbody id="businessList">
                        <!-- 사업장 리스트가 여기에 추가됩니다. -->
                        </tbody>
                    </table>
                </div>
                <div class="text-center mt-4">
                    <button class="btn btn-success" onclick="addNewBusiness()">추가</button>
                </div>
            </div>
        </div>
    </div>

    <!-- 사업장 상세보기 및 수정 모달 -->
    <div class="container mt-5">
        <!-- 가맹점 정보수정 모달 -->
        <div class="modal fade" id="businessDetailModal" tabindex="-1" aria-labelledby="businessDetailModalLabel" aria-hidden="true">
            <div class="modal-dialog modal-dialog-centered modal-dialog-scrollable modal-lg justify-content-center">
                <div class="modal-content">
                    <div class="modal-header">
                        <h5 class="modal-title" id="businessDetailModalLabel">가맹점 정보수정</h5>
                        <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
                    </div>
                    <div class="modal-body">
                        <!-- 사업장명 입력 및 수정 버튼 -->
                        <div class="input-group mb-3">
                            <span class="input-group-text">가맹점 이름</span>
                            <input type="text" class="form-control" id="detailBusinessName" placeholder="사업장명을 입력하세요" readonly>
                            <button type="button" class="btn btn-outline-success" onclick="enableEdit('detailBusinessName')">수정</button>
                        </div>

                        <!-- 위치 수정 -->
                        <div class="input-group mb-3">
                            <span class="input-group-text">위치</span>
                            <input type="text" class="form-control" id="detailBusinessLocation" placeholder="위치정보를 입력하세요." readonly>
                            <button type="button" class="btn btn-outline-success" onclick="enableEdit('detailBusinessLocation')">수정</button>
                        </div>

                        <!-- 파일 선택 -->
                        <div class="mb-3">
                            <input class="form-control" type="file" id="formFileMultiple" multiple>
                        </div>

                        <!-- 업종 선택 -->
                        <div class="mb-3">
                            <select class="form-select" id="detailBusinessCategory" aria-label="Default select example">
                                <option selected>업종 선택</option>
                                <option value="음식점">음식점</option>
                                <option value="술집">술집</option>
                                <option value="기타">기타</option>
                            </select>
                        </div>

                        <!-- 영업시간 수정 -->
                        <div class="input-group mb-3">
                            <span class="input-group-text">영업시간</span>
                            <input type="text" class="form-control" id="detailBusinessHours" placeholder="영업시간을 입력하세요." readonly>
                            <button type="button" class="btn btn-outline-success" onclick="enableEdit('detailBusinessHours')">수정</button>
                        </div>

                        <!-- 제공서비스 수정 -->
                        <div class="input-group mb-3">
                            <span class="input-group-text">제공 서비스</span>
                            <input type="text" class="form-control" id="detailServicesProvided" placeholder="제공 서비스를 입력하세요." readonly>
                            <button type="button" class="btn btn-outline-success" onclick="enableEdit('detailServicesProvided')">수정</button>
                        </div>

                        <!-- 기타 수정 -->
                        <div class="input-group mb-3">
                            <span class="input-group-text">기타</span>
                            <input type="text" class="form-control" id="detailAdditionalInfo" placeholder="기타 정보를 입력하세요." readonly>
                            <button type="button" class="btn btn-outline-success" onclick="enableEdit('detailAdditionalInfo')">수정</button>
                        </div>
                    </div>
                    <div class="modal-footer justify-content-center">
                        <button type="button" class="btn btn-danger" onclick="saveAllChanges()">수정하기</button>
                        <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">취소</button>
                    </div>
                </div>
            </div>
        </div>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script src="../js/businessManagementPage.js"></script>
</body>
</html>
